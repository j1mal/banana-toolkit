[package]
name = "banana-toolkit"
version = "0.1.0"
description = "PGP-verified community library & declarative recipe runner"
authors = ["j1mal"]
edition = "2021"

[lib]
name = "banana_toolkit_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.42", features = ["fs", "process", "io-util", "time", "rt-multi-thread", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
sha2 = "0.10"
hex = "0.4"
pgp = { version = "0.14", default-features = false }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
smallvec = "1.13"

